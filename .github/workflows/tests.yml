name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: Laravel ${{ matrix.laravel }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        laravel: ['12', '13']
        include:
          - laravel: '12'
            testbench: '^10.8'
            phpunit: '^11.5'
          - laravel: '13'
            testbench: '^11.0'
            phpunit: '^12.0'
    steps:
      - uses: actions/checkout@v4
      - name: Test frontend interactions
        if: matrix.php == '8.3' && matrix.laravel == '12'
        run: node --test tests/JavaScript/*.test.mjs
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sodium, dom, mbstring, xml, curl, zip, fileinfo, gd
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - name: Select Laravel and test dependencies
        run: composer require --dev "laravel/framework:^${{ matrix.laravel }}.0" "orchestra/testbench:${{ matrix.testbench }}" "phpunit/phpunit:${{ matrix.phpunit }}" --no-update --no-interaction
      - run: composer update --no-interaction --prefer-dist --no-progress
      - run: composer test
